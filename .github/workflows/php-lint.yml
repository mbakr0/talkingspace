name: PHP syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Validate Vercel configuration
        run: php -r '$json = json_decode(file_get_contents("vercel.json"), true, 512, JSON_THROW_ON_ERROR); echo "vercel.json is valid JSON";'
