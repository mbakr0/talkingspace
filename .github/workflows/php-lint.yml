name: PHP CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathai/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Validate Vercel JSON
        run: php -r 'json_decode(file_get_contents("vercel.json"), true, 512, JSON_THROW_ON_ERROR);'
